<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Thanks | Florence Tabletop Guild</title>
  <meta name="description" content="Thanks for joining the Florence Tabletop Guild community interest list.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <style>
    .thanks-main { min-height: 32rem; display: grid; place-items: center; padding: 4rem 1rem; background: linear-gradient(135deg,#17111f,#2a1934); color: var(--text); }
    .thanks-card { width: min(42rem,100%); padding: clamp(1.5rem,5vw,3rem); border: 1px solid rgba(255,255,255,.13); border-radius: 1rem; background: rgba(255,255,255,.05); text-align: center; }
    .thanks-card p { margin-inline: auto; color: #d4c9d9; }
  </style>
</head>
<body>
<main class="thanks-main">
  <section class="thanks-card">
    <p class="eyebrow">Florence Tabletop Guild</p>
    <h1>You are on the list.</h1>
    <p>Thanks for telling us how you want to participate. This interest list will help us see where Florence has enough players, beginners, DMs, and Keepers to start building real tables.</p>
    <a class="button button-gold" href="/">Back to Florence Tabletop Guild</a>
  </section>
</main>
</body>
</html>
