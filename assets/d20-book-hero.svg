<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" role="img" aria-labelledby="title desc">
<title id="title">A polished gold and purple twenty-sided die above an open book</title>
<desc id="desc">An accurate icosahedron-style d20 with twenty triangular faces, representing tabletop role-playing games and shared stories.</desc>
<defs>
  <radialGradient id="halo" cx="50%" cy="42%" r="55%">
    <stop offset="0%" stop-color="#8b4db3" stop-opacity=".38"/>
    <stop offset="62%" stop-color="#4d2679" stop-opacity=".08"/>
    <stop offset="100%" stop-color="#171322" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="bookPaper" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#fffaf1"/>
    <stop offset="100%" stop-color="#ddc9a8"/>
  </linearGradient>
  <linearGradient id="bookEdge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#5a3924"/>
    <stop offset="50%" stop-color="#8c6844"/>
    <stop offset="100%" stop-color="#5a3924"/>
  </linearGradient>
  <filter id="dieShadow" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="26" stdDeviation="18" flood-color="#08050e" flood-opacity=".68"/>
  </filter>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="18"/>
  </filter>
</defs>
<ellipse cx="350" cy="292" rx="285" ry="268" fill="url(#halo)"/>
