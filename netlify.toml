[build]
  command = "node scripts/validate-site.mjs && node scripts/validate-organizer.mjs && node scripts/check-organizer-js.mjs && node scripts/build-shell.mjs && node scripts/build-css.mjs && node scripts/build-meta.mjs && node scripts/validate-site.mjs && node scripts/validate-organizer.mjs"
  publish = "."

# Public clean URLs. Source files stay static and framework-free.
[[redirects]]
  from = "/first-adventure.html"
  to = "/learn"
  status = 301
  force = true
[[redirects]]
  from = "/character-sheet-guide.html"
  to = "/character-sheet"
  status = 301
  force = true
[[redirects]]
  from = "/guild-hall.html"
  to = "/guild"
  status = 301
  force = true
[[redirects]]
  from = "/one-shots.html"
  to = "/adventures"
  status = 301
  force = true
[[redirects]]
  from = "/tools.html"
  to = "/tools"
  status = 301
  force = true
[[redirects]]
  from = "/join.html"
  to = "/find-table"
  status = 301
  force = true
[[redirects]]
  from = "/youth-groups.html"
  to = "/youth"
  status = 301
  force = true

[[redirects]]
  from = "/learn"
  to = "/first-adventure.html"
  status = 200
[[redirects]]
  from = "/character-sheet"
  to = "/character-sheet-guide.html"
  status = 200
[[redirects]]
  from = "/guild"
  to = "/guild-hall.html"
  status = 200
[[redirects]]
  from = "/adventures"
  to = "/one-shots.html"
  status = 200
[[redirects]]
  from = "/tools"
  to = "/tools.html"
  status = 200
[[redirects]]
  from = "/find-table"
  to = "/join.html"
  status = 200
[[redirects]]
  from = "/youth"
  to = "/youth-groups.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://vtqoxflirpfhnxzzpxfa.supabase.co; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; upgrade-insecure-requests"

# Content-hashed production CSS can be cached permanently.
[[headers]]
  for = "/assets/css/build/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Source-named images and scripts revalidate so a deploy can replace them safely.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=0, stale-while-revalidate=86400"
